name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Make Replit package URLs accessible to GitHub
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package-lock.json';
          const lock = JSON.parse(readFileSync(path, 'utf8'));
          const internalRegistry = 'http://package-firewall.replit.internal/npm/';
          for (const pkg of Object.values(lock.packages)) {
            if (pkg.resolved?.startsWith(internalRegistry)) {
              pkg.resolved = 'https://registry.npmjs.org/' + pkg.resolved.slice(internalRegistry.length);
            }
          }
          writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
      - run: npm ci
      - name: Validate schema.json and graph data
        run: npm run check:schema
      # Rebuilds public/graph.json from data/seed/rare_graph.json, the HPO reference and the Reactome
      # pathways (all committed), and fails if a byte differs or an input is missing.
      - name: The atlas graph rebuilds from its committed inputs
        run: npm run data:graph -- --check
      - name: Unit tests and the grading answer key
        run: npm test
      - name: Committed grades match the engine
        run: npm run grade:check
      - name: Build (also generates Next.js types)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
